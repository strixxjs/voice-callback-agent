# Conversation script configuration — editable without code changes
# Supported languages: "uk" (default demo), "pl", "en"
company_name: "Solaris Tech"
agent_name: "Саня"
language: "uk"

# Greeting: AI assistant intro + call recording disclosure
greeting: "Доброго дня! Це Саня, ШІ-асистентка Solaris Tech щодо вашої заявки. Зручно зараз говорити?"

# Closing phrase spoken when the call wraps up
closing_phrase: "Дякую за розмову! Менеджер зв'яжеться з вами найближчим часом. Гарного дня та до побачення!"

# Fixed error phrase spoken if LLM fails after all retries and fallbacks
error_phrase: "Перепрошую, у нас виникла технічна помилка. Наш менеджер обов'язково зателефонує вам найближчим часом. До побачення!"

# Questions to ask in order
questions:
  - field: "name"
    question: "Чи можу я уточнити ваше ім'я та прізвище?"
    required: true
  - field: "service"
    question: "Яка саме послуга чи рішення вас найбільше цікавить?"
    required: true
  - field: "timeline"
    question: "На коли ви плануєте реалізацію або впровадження проекту?"
    required: false
  - field: "preferred_call_time"
    question: "О котрій годині нашому менеджеру буде найзручніше вам зателефонувати?"
    required: true
